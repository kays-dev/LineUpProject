<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modification du planning - DOLCEVITA SUR SEINE</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/Planning.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img class="logo" src="../assets/logo.svg" alt="Logo Dolcevita sur Seine">
        <div class="brand-info">
          <span class="brand-title">DOLCEVITA SUR SEINE</span>
          <span class="brand-subtitle">Backoffice · by LineUp</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="Dashboard.html" class="nav-item">TABLEAU DE BORD</a>
        <a href="GestionActivite.html" class="nav-item">ACTIVITÉS</a>
        <a href="GestionReservation.html" class="nav-item">RÉSERVATIONS</a>
        <a href="Planning.html" class="nav-item active">PLANNING</a>
        <a href="ProfilUtilisateurs.html" class="nav-item">PROFIL</a>
      </nav>

      <div class="sidebar-footer">
        <a class="user-block" href="ProfilStaff.html">
          <div class="user-avatar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div class="user-details">
            <span class="user-name" id="sidebarName">…</span>
            <span class="user-role" id="sidebarRole"></span>
          </div>
        </a>
        <a class="logout-link" onclick="logout()">DÉCONNEXION</a>
      </div>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <h1 class="page-title">Déplacer un atelier</h1>
          <p class="page-subtitle"><span id="pageSubtitle">Planning · …</span></p>
        </div>
      </header>

      <form class="form-card" id="planningForm">
        <h2 class="form-title">ATELIER CONCERNÉ</h2>
        <div class="form-group">
          <input type="text" id="atelier" readonly>
        </div>
        <p class="note">Les réservations existantes sont conservées : les participants restent inscrits à l'atelier déplacé.</p>

        <h2 class="form-title">NOUVELLE PROGRAMMATION</h2>
        <div class="form-row">
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label for="debut">Heure de début</label>
            <input type="time" id="debut" required>
          </div>
          <div class="form-group">
            <label for="fin">Heure de fin</label>
            <input type="time" id="fin" required>
          </div>
        </div>

        <p class="message-erreur" id="message" hidden></p>

        <div class="form-actions">
          <a href="Planning.html" class="btn btn-secondary">ANNULER</a>
          <button type="submit" class="btn btn-primary">ENREGISTRER</button>
        </div>
      </form>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/services/session.js"></script>
  <script src="../js/services/api.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/utils/statuts.js"></script>
  <script src="../js/components/icones.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/controllers/ModificationPlanning.js"></script>
</body>
</html>
