<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Staff - DOLCEVITA SUR SEINE</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/Profil.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-box">LU</div>
        <div class="brand-info">
          <span class="brand-title">DOLCEVITA SUR SEINE</span>
          <span class="brand-subtitle">Backoffice · by LineUp</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="Dashboard.html" class="nav-item">TABLEAU DE BORD</a>
        <a href="GestionActivite.html" class="nav-item">ACTIVITÉS</a>
        <a href="GestionReservation.html" class="nav-item">RÉSERVATIONS</a>
        <a href="Planning.html" class="nav-item">PLANNING</a>
        <a href="ProfilUtilisateurs.html" class="nav-item active">PROFIL</a>
      </nav>

      <div class="sidebar-footer">
        <a class="user-block" href="ProfilStaff.html">
          <div class="user-avatar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div class="user-details">
            <span class="user-name" id="sidebarName">…</span>
            <span class="user-role" id="sidebarRole"></span>
          </div>
        </a>
        <a class="logout-link" onclick="logout()">DÉCONNEXION</a>
      </div>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <h1 class="page-title">Profil</h1>
          <p class="page-subtitle">Mon compte</p>
        </div>
      </header>

      <div class="profil-card profil-staff">
        <div class="identity">
          <div class="avatar" id="avatar">?</div>
          <h2 class="identity-name" id="userName">…</h2>
          <p class="identity-email" id="userEmail"></p>
        </div>

        <form id="staffForm">
          <!-- L'e-mail ne se modifie plus : il est seulement affiché -->
          <div class="form-group">
            <label for="email">Identifiant / e-mail</label>
            <input type="email" id="email" readonly>
          </div>
          <div class="form-group">
            <label for="motDePasseActuel">Mot de passe actuel</label>
            <input type="password" id="motDePasseActuel" autocomplete="current-password" required>
          </div>
          <div class="form-group">
            <label for="nouveauMotDePasse">Nouveau mot de passe</label>
            <input type="password" id="nouveauMotDePasse" placeholder="6 caractères minimum" autocomplete="new-password" required>
          </div>

          <p class="message-erreur" id="message" hidden></p>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">CHANGER LE MOT DE PASSE</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/services/session.js"></script>
  <script src="../js/services/api.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/utils/statuts.js"></script>
  <script src="../js/components/icones.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/controllers/ProfilStaff.js"></script>
</body>
</html>
