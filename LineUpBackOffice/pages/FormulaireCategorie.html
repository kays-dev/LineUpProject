<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gérer les catégories - DOLCEVITA SUR SEINE</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/base.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img class="logo" src="../assets/logo.svg" alt="Logo Dolcevita sur Seine">
        <div class="brand-info">
          <span class="brand-title">DOLCEVITA SUR SEINE</span>
          <span class="brand-subtitle">Backoffice · by LineUp</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="Dashboard.html" class="nav-item">TABLEAU DE BORD</a>
        <a href="GestionActivite.html" class="nav-item active">ACTIVITÉS</a>
        <a href="GestionReservation.html" class="nav-item">RÉSERVATIONS</a>
        <a href="Planning.html" class="nav-item">PLANNING</a>
        <a href="ProfilUtilisateurs.html" class="nav-item">PROFIL</a>
      </nav>

      <div class="sidebar-footer">
        <a class="user-block" href="ProfilStaff.html">
          <div class="user-avatar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div class="user-details">
            <span class="user-name" id="sidebarName">…</span>
            <span class="user-role" id="sidebarRole"></span>
          </div>
        </a>
        <a class="logout-link" onclick="logout()">DÉCONNEXION</a>
      </div>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <h1 class="page-title">Gérer les catégories</h1>
          <p class="page-subtitle">Activités · Catégories</p>
        </div>
      </header>

      <form class="form-card" id="categoryForm">
        <!-- Choix de la méthode : Ajouter = POST, Modifier = PUT -->
        <div class="mode-switch">
          <button type="button" id="boutonAjouter" onclick="choisirMode('ajouter')">AJOUTER</button>
          <button type="button" id="boutonModifier" onclick="choisirMode('modifier')">MODIFIER</button>
        </div>

        <div class="form-group">
          <label for="nom">Nom de la catégorie</label>
          <input type="text" id="nom" placeholder="ex. Atelier cuisine" required>
        </div>

        <!-- Visible seulement en mode "Modifier" : un clic choisit la catégorie à modifier -->
        <div id="blocExistantes" hidden>
          <h2 class="form-title">CATÉGORIES EXISTANTES</h2>
          <div class="chips" id="listeCategories"></div>
          <p class="note">Cliquez sur une catégorie pour la modifier. Le nom ci-dessus se met à jour.</p>
        </div>

        <p class="message-erreur" id="message" hidden></p>

        <div class="form-actions">
          <a href="GestionCategorie.html" class="btn btn-secondary">ANNULER</a>
          <button type="submit" class="btn btn-primary">ENREGISTRER</button>
        </div>
      </form>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/services/session.js"></script>
  <script src="../js/services/api.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/utils/statuts.js"></script>
  <script src="../js/components/icones.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/controllers/FormulaireCategorie.js"></script>
</body>
</html>
