<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - DOLCEVITA SUR SEINE</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/Connexion.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img class="logo" src="../assets/logo.svg" alt="Logo Dolcevita sur Seine">
        <div class="brand-info">
          <span class="brand-title">DOLCEVITA SUR SEINE</span>
          <span class="brand-subtitle">Backoffice · by LineUp</span>
        </div>
      </div>
    </aside>

    <main class="centre">
      <div class="auth-card">
        <h1>Heureux de vous revoir.</h1>
        <p class="auth-lead">Connectez-vous à l'espace de gestion du festival.</p>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Identifiant / e-mail</label>
            <input type="email" id="email" placeholder="exemple@dolcevita.fr" required>
          </div>
          <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" placeholder="Votre mot de passe" required>
          </div>

          <!-- Message d'erreur : rempli par Connexion.js si la connexion échoue -->
          <p class="message-erreur" id="message" hidden></p>

          <button type="submit" class="btn btn-primary">SE CONNECTER</button>
        </form>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/services/session.js"></script>
  <script src="../js/services/api.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/utils/statuts.js"></script>
  <script src="../js/components/icones.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/controllers/Connexion.js"></script>
</body>
</html>
